<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GenPlayer — Chia đội bóng sân 7</title>
<style>
:root{
  --bg:#f1f5f9; --surface:#fff; --line:#e6eaf1; --line2:#eef2f7;
  --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --brand:#16a34a; --brand-d:#15803d; --brand-soft:#dcfce7;
  --blue:#2563eb; --blue-soft:#dbeafe; --amber:#d97706; --amber-soft:#fef3c7; --slate-soft:#e2e8f0;
  --red:#dc2626;
  --r:16px; --r-sm:10px;
  --sh:0 1px 2px rgba(15,23,42,.04),0 6px 16px rgba(15,23,42,.06);
  --sh-sm:0 1px 2px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
input,button,select{font-family:inherit}
input[type=checkbox],input[type=radio]{accent-color:var(--brand);width:16px;height:16px}
.screen{display:none;max-width:920px;margin:0 auto;padding:18px 16px 40px}
/* app bar */
.appbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:11px 16px}
.ab-back{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.ab-back:hover{background:#f8fafc;border-color:#cbd5e1}
.ab-title{font-weight:800;font-size:17px;letter-spacing:-.01em}
.ab-brand{color:var(--brand)}
/* hero + menu */
.hero{text-align:center;padding:28px 10px 22px}
.hero .logo{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,var(--brand),#22c55e);
  display:inline-flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 10px 24px rgba(22,163,74,.32)}
.hero h1{font-size:24px;margin-top:14px;letter-spacing:-.02em}
.hero p{color:var(--muted);font-size:14px;margin-top:5px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.menu-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;text-align:left;
  cursor:pointer;box-shadow:var(--sh);transition:.16s;display:flex;flex-direction:column;gap:10px}
.menu-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(15,23,42,.10);border-color:#d7deea}
.menu-card:active{transform:translateY(-1px)}
.menu-ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px}
.ic-green{background:var(--brand-soft)}.ic-blue{background:var(--blue-soft)}.ic-amber{background:var(--amber-soft)}.ic-slate{background:var(--slate-soft)}
.menu-card .t{font-weight:800;font-size:16px}
.menu-card .d{font-size:12.5px;color:var(--muted);line-height:1.4}
/* card / panel */
.card-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
/* roster */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pl-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;
  cursor:pointer;user-select:none;background:#fff;transition:.12s}
.pl-item:hover{border-color:#cbd5e1}
.pl-item.on{border-color:var(--brand);background:#f0fdf4}
.pl-item.off{opacity:.5}
.avatar{width:32px;height:32px;border-radius:50%;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pl-name{font-size:13.5px;font-weight:600;flex:1;display:flex;align-items:center;gap:5px;min-width:0}
.pl-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-dot{width:8px;height:8px;border-radius:50%;background:#3b82f6;flex:0 0 auto}
.ovb{font-size:11px;font-weight:800;color:#475569;background:#f1f5f9;border-radius:20px;padding:2px 8px;flex:0 0 auto}
.pl-item input{margin-left:2px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.count{color:var(--muted);font-size:13px;margin-left:auto}.count b{color:var(--text)}
.status{text-align:center;color:var(--muted);font-size:13px;margin:14px 0 0}
/* buttons */
.btn{background:var(--brand);color:#fff;border:0;border-radius:11px;padding:11px 20px;font-size:14.5px;font-weight:700;
  cursor:pointer;box-shadow:0 4px 12px rgba(22,163,74,.25);transition:.14s}
.btn:hover{background:var(--brand-d)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.55;cursor:default;box-shadow:none}
.btn.alt{background:#fff;color:var(--text);border:1px solid var(--line);box-shadow:var(--sh-sm)}
.btn.alt:hover{background:#f8fafc;border-color:#cbd5e1}
.btn.dark{background:var(--text);box-shadow:0 4px 12px rgba(15,23,42,.2)}.btn.dark:hover{background:#1e293b}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
/* pitch */
.pred{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px 16px;margin:0 auto 16px;max-width:832px;text-align:center;font-size:14px;line-height:1.55;color:#14532d}
.matchwrap{width:100%;max-width:832px;margin:0 auto;overflow:hidden;border-radius:var(--r);box-shadow:var(--sh)}
.match{width:832px;transform-origin:top left}
.mhead{display:flex;overflow:hidden}
.mh{flex:1;font-weight:800;font-size:13px;padding:9px 14px;letter-spacing:.2px}
.mh.l{text-align:left}.mh.r{text-align:right}
.field{position:relative;height:384px;overflow:hidden;background:repeating-linear-gradient(90deg,#43b455 0 58px,#39a449 58px 116px);display:flex;align-items:stretch;padding:6px 2px}
.mk{position:absolute;border:2px solid #ffffff9c}
.vhalf{left:50%;top:8px;bottom:8px;width:0;border:0;border-left:2px solid #ffffff9c}
.ccircle{width:80px;height:80px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.boxL{left:0;top:50%;transform:translateY(-50%);width:46px;height:176px;border-left:0}
.boxR{right:0;top:50%;transform:translateY(-50%);width:46px;height:176px;border-right:0}
.goalL{left:0;top:50%;transform:translateY(-50%);width:8px;height:55px;background:#ffffff66;border:0}
.goalR{right:0;top:50%;transform:translateY(-50%);width:8px;height:55px;background:#ffffff66;border:0}
.col{flex:1;display:flex;flex-direction:column;justify-content:space-around;align-items:center;position:relative;z-index:2}
.gkcol{flex:.72}
.player{display:flex;flex-direction:column;align-items:center;width:84px}
.player.pop{animation:pop .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.82)}to{opacity:1;transform:none}}
.jersey{filter:drop-shadow(0 2px 3px #0006)}
.name{color:#fff;font-weight:700;font-size:10px;margin-top:1px;text-align:center;line-height:1.1;text-shadow:0 1px 3px #000b}
.sub{color:#f4fff7;font-size:8px;margin-top:0;text-shadow:0 1px 3px #000b;opacity:.95}
.star{color:#ffe14d}
.benchrow{display:flex}
.benchcol{flex:1;background:#fff;padding:9px 12px;font-size:11px;color:#475569;border-top:1px solid var(--line)}
.benchcol.l{border-right:1px solid var(--line)}
.subs-lbl{color:var(--muted);font-weight:700;margin-right:4px}
.subchip{display:inline-block;background:#f1f5f9;border:1px solid var(--line);padding:2px 8px;border-radius:20px;color:#334155;margin:2px 3px;font-size:11px}
.report{max-width:832px;margin:22px auto 0}
.report h2{font-size:15px;margin:20px 0 10px;letter-spacing:-.01em}
.persuade{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:12px 15px;margin:2px 0 12px;font-size:13.5px;line-height:1.6;color:#334155}
.cards{display:flex;gap:14px;flex-wrap:wrap}
.card{flex:1;min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.55;box-shadow:var(--sh-sm)}
.card h3{font-size:14px;margin-bottom:8px;letter-spacing:-.01em}
.card .ul{margin:2px 0 0;padding-left:18px}.card li{margin:5px 0;line-height:1.5}
.wk{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);color:#b45309;font-size:12.5px;line-height:1.5}
.pl-win{margin-top:6px;color:var(--brand-d);font-size:12.5px;line-height:1.5}
table.stat{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--sh-sm)}
table.stat th,table.stat td{padding:9px 13px;border-bottom:1px solid var(--line2);text-align:center}
table.stat tr:last-child td{border-bottom:0}
table.stat td:first-child{text-align:left;color:#475569}table.stat th{background:#f8fafc;color:#475569;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
table.stat td:not(:first-child){font-weight:700}
.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:24px}
/* editor */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.hint{font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.editor-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);box-shadow:var(--sh-sm);background:#fff}
table.edit{width:100%;border-collapse:collapse;font-size:12px;min-width:720px}
table.edit th{background:#f8fafc;color:#475569;padding:9px 4px;font-weight:700;border-bottom:1px solid var(--line);position:sticky;top:0}
table.edit td{border-bottom:1px solid var(--line2);padding:5px 4px;text-align:center}
table.edit tr:hover td{background:#fafbfc}
table.edit input[type=number]{width:38px;padding:5px 2px;border:1px solid var(--line);border-radius:7px;text-align:center;font-size:12px}
table.edit input[type=number]:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
table.edit input[type=text]{width:128px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px}
table.edit input[type=text]:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.iconbtn{background:#f1f5f9;border:0;cursor:pointer;font-size:14px;padding:5px 7px;border-radius:8px;transition:.12s}
.iconbtn:hover{background:#e2e8f0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal-box{background:#fff;border-radius:18px;padding:20px;max-width:390px;width:100%;box-shadow:0 24px 60px rgba(15,23,42,.3)}
.modal-box h3{margin-bottom:14px;font-size:17px;letter-spacing:-.01em}
.mrow{margin:12px 0;font-size:13px}.mrow .lbl{font-weight:700;color:#475569;margin-bottom:6px;display:block}
.mrow label{display:inline-flex;align-items:center;gap:5px;margin-right:14px;cursor:pointer}
.modal-box select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;width:100%}
/* history */
.history-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh-sm)}
.history-item .h-ic{width:40px;height:40px;border-radius:11px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.history-item .meta{flex:1;min-width:0}.history-item .dt{font-weight:700}.history-item .sub2{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:46px 16px;font-size:14px;line-height:1.7;background:#fff;border:1px dashed var(--line);border-radius:16px}
.empty .big{font-size:40px;display:block;margin-bottom:10px;opacity:.7}
/* dashboard stats + tab bar */
body{padding-bottom:78px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--sh-sm)}
.stat .v{font-size:25px;font-weight:800;letter-spacing:-.02em}
.stat .k{font-size:12px;color:var(--muted);margin-top:2px}
.stat.accent{background:linear-gradient(135deg,var(--brand),#22c55e);border:0;color:#fff;box-shadow:0 8px 20px rgba(22,163,74,.28)}
.stat.accent .k{color:#dcfce7}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 4px 8px}
.tab{flex:1;max-width:130px;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 2px;border-radius:11px;color:var(--faint);font-size:10.5px;font-weight:600;transition:.12s}
.tab .ti{font-size:19px;line-height:1}
.tab.on{color:var(--brand)}.tab.on .ti{transform:translateY(-1px)}
.tab:hover{color:var(--muted)}
@media(min-width:760px){.tabbar{max-width:580px;margin:0 auto;border:1px solid var(--line);border-radius:20px;bottom:16px;box-shadow:var(--sh)}}
</style></head><body>

<header class="appbar">
  <button class="ab-back" id="backBtn" onclick="show('home')" aria-label="Quay lại">←</button>
  <div class="ab-title" id="appTitle"><span class="ab-brand">⚽ GenPlayer</span></div>
  <span id="cloud" style="margin-left:auto;font-size:12px;font-weight:700"></span>
</header>

<!-- ====== MENU ====== -->
<div id="home" class="screen">
  <div class="hero">
    <span class="logo">⚽</span>
    <h1>Chia đội bóng sân 7</h1>
    <p>Cân bằng tự động · công bằng cho mọi người</p>
  </div>
  <div class="stats" id="homeStats"></div>
  <div class="menu">
    <button class="menu-card" onclick="show('screen-create')"><span class="menu-ic ic-green">⚽</span><span class="t">Tạo đội</span><span class="d">Chọn người có mặt → chia 2 đội cân</span></button>
    <button class="menu-card" onclick="show('screen-players')"><span class="menu-ic ic-blue">✏️</span><span class="t">Cập nhật cầu thủ</span><span class="d">Sửa điểm · thêm / xóa người</span></button>
    <button class="menu-card" onclick="show('screen-week')"><span class="menu-ic ic-amber">📋</span><span class="t">Đội tuần này</span><span class="d">Đội đã lưu gần nhất</span></button>
    <button class="menu-card" onclick="show('screen-history')"><span class="menu-ic ic-slate">🕐</span><span class="t">Lịch sử</span><span class="d">Các đội đã lưu trước đây</span></button>
  </div>
</div>

<!-- ====== TAO DOI ====== -->
<div id="screen-create" class="screen">
  <div class="card-box">
    <div class="section-title">Người có mặt hôm nay</div>
    <div class="grid" id="roster"></div>
    <div class="bar">
      <button class="btn" id="go" title="Bấm lại để đổi sang cách chia cân khác">⚽ Tạo 2 đội</button>
      <button class="btn alt sm" id="all">Chọn tất cả</button>
      <button class="btn alt sm" id="none">Bỏ chọn</button>
      <span class="count" id="count"></span>
    </div>
  </div>
  <div class="status" id="status"></div>
  <div style="text-align:center;margin:14px 0"><button class="btn dark sm" id="saveWeek" style="display:none">💾 Lưu làm đội tuần này</button></div>
  <div id="result"></div>
</div>

<!-- ====== CAP NHAT CAU THU ====== -->
<div id="screen-players" class="screen">
  <div class="toolbar">
    <button class="btn sm" onclick="savePlayersFromEditor()">💾 Lưu</button>
    <button class="btn alt sm" onclick="addPlayerRow()">➕ Thêm</button>
    <button class="btn alt sm" onclick="exportPlayers()">⬇️ Xuất JSON</button>
    <label class="btn alt sm" style="cursor:pointer">⬆️ Nhập JSON<input type="file" id="impFile" accept=".json" hidden></label>
    <button class="btn alt sm" onclick="resetPlayers()">↺ Mặc định</button>
  </div>
  <div class="hint">⚡ = nhập nhanh (trình độ/vị trí/nhanh-chậm) tự ra điểm · ☑ ưu tiên dự bị · nhớ bấm <b>Lưu</b> sau khi sửa</div>
  <div class="editor-wrap">
    <table class="edit"><thead><tr>
      <th>Dự bị</th><th style="text-align:left;padding-left:10px">Tên</th><th>KT</th><th>CH</th><th>DĐ</th><th>PN</th><th>TC</th><th>TL</th><th>ĐN</th><th>TD</th><th>TM</th><th></th><th></th>
    </tr></thead><tbody id="editor-body"></tbody></table>
  </div>
</div>

<!-- ====== DOI TUAN NAY ====== -->
<div id="screen-week" class="screen">
  <div id="week-info" class="status" style="margin:0 0 12px"></div>
  <div id="week-result"></div>
</div>

<!-- ====== LICH SU ====== -->
<div id="screen-history" class="screen">
  <div class="toolbar"><button class="btn alt sm" onclick="exportHistory()">⬇️ Xuất lịch sử JSON</button></div>
  <div id="history-list"></div>
  <div id="history-detail" style="margin-top:18px"></div>
</div>

<!-- ====== MODAL ====== -->
<div class="modal" id="quickModal">
  <div class="modal-box">
    <h3>⚡ Nhập nhanh điểm</h3>
    <div class="mrow"><span class="lbl">Trình độ</span>
      <select id="q-tier"><option value="NS">Ngôi sao</option><option value="K">Khá</option><option value="TB" selected>Trung bình</option><option value="Y">Yếu</option></select></div>
    <div class="mrow"><span class="lbl">Vị trí đá được (chọn nhiều)</span>
      <label><input type="checkbox" id="q-GK">Thủ môn</label><label><input type="checkbox" id="q-HV">Hậu vệ</label><label><input type="checkbox" id="q-TV">Tiền vệ</label><label><input type="checkbox" id="q-TD">Tiền đạo</label></div>
    <div class="mrow"><span class="lbl">Tốc độ</span>
      <label><input type="radio" name="q-spd" value="F">Nhanh</label><label><input type="radio" name="q-spd" value="" checked>Bình thường</label><label><input type="radio" name="q-spd" value="S">Chậm</label></div>
    <div class="mrow"><span class="lbl">Độ nhiệt</span>
      <label><input type="radio" name="q-wr" value="H">Chịu chạy</label><label><input type="radio" name="q-wr" value="" checked>Bình thường</label><label><input type="radio" name="q-wr" value="L">Lười</label></div>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn sm" onclick="applyQuick()">Áp dụng</button><button class="btn alt sm" onclick="closeQuick()">Hủy</button></div>
  </div>
</div>

<nav class="tabbar">
  <button class="tab" data-s="home" onclick="show('home')"><span class="ti">🏠</span>Tổng quan</button>
  <button class="tab" data-s="screen-create" onclick="show('screen-create')"><span class="ti">⚽</span>Tạo đội</button>
  <button class="tab" data-s="screen-players" onclick="show('screen-players')"><span class="ti">👥</span>Cầu thủ</button>
  <button class="tab" data-s="screen-week" onclick="show('screen-week')"><span class="ti">📋</span>Tuần này</button>
  <button class="tab" data-s="screen-history" onclick="show('screen-history')"><span class="ti">🕐</span>Lịch sử</button>
</nav>

<!-- Firebase (chỉ dùng khi đồng bộ; lỗi mạng/không có config thì tự về chế độ cục bộ) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>/*__OPTIMIZER__*/</script>
<script>
const DEFAULT_PLAYERS = /*__PLAYERS__*/;
const FIREBASE_CONFIG = /*__FIREBASE__*/;
const LS={players:"gp_players",history:"gp_history"};
const TITLES={home:'<span class="ab-brand">⚽ GenPlayer</span>',"screen-create":"⚽ Tạo đội","screen-players":"✏️ Cập nhật cầu thủ","screen-week":"📋 Đội tuần này","screen-history":"🕐 Lịch sử"};
const POSNAME={GK:"Thủ môn","Thòng":"Trung vệ",HV:"Hậu vệ",TVtt:"Tiền vệ giữa",TV:"Tiền vệ cánh","TĐ":"Tiền đạo"};
const KIT_A={body:"#bd2004",sleeve:"#911503",trim:"#ffffff"}, KIT_B={body:"#fcba03",sleeve:"#11224f",trim:"#11224f"};
const CAtxt="#bd2004", CBtxt="#11224f";
const ov = s => (s.KT+s.CH+s.DD+s.PN+s.TC+s.TL+s.DN+s.TD)/8;
const $=id=>document.getElementById(id);
function initials(n){const p=(n||"").trim().split(/\s+/);return((p[0]&&p[0][0]||"")+(p.length>1?p[p.length-1][0]:"")).toUpperCase();}
function avColor(n){let h=0;for(const c of (n||""))h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 52% 52%)`;}

// ---- data (JSON; localStorage + Firebase real-time nếu có config) ----
let STATE={players:DEFAULT_PLAYERS.map(p=>({...p})), history:[], cloud:false, docRef:null};
function localLoad(){
  try{const s=localStorage.getItem(LS.players); if(s)STATE.players=JSON.parse(s);}catch(e){}
  try{const s=localStorage.getItem(LS.history); if(s)STATE.history=JSON.parse(s);}catch(e){}
}
function getPlayers(){return STATE.players.map(p=>({...p}));}
function getHistory(){return STATE.history.slice();}
function persist(){
  try{localStorage.setItem(LS.players,JSON.stringify(STATE.players));localStorage.setItem(LS.history,JSON.stringify(STATE.history));}catch(e){}
  if(STATE.cloud&&STATE.docRef){STATE.docRef.set({players:STATE.players,history:STATE.history}).catch(err=>console.warn("Lưu cloud lỗi:",err));}
}
function setPlayers(a){STATE.players=a;persist();}
function setHistory(a){STATE.history=a;persist();}
function setCloudBadge(){const el=$("cloud");if(!el)return;el.innerHTML=STATE.cloud?'☁️ <span style="color:#16a34a">Đồng bộ</span>':'<span style="color:#94a3b8">📵 Cục bộ</span>';}
function initCloud(){
  if(!FIREBASE_CONFIG||typeof firebase==="undefined")return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    STATE.docRef=firebase.firestore().collection("genplayer").doc("data");
    STATE.cloud=true;
    STATE.docRef.onSnapshot(snap=>{
      if(snap.exists){const d=snap.data();if(Array.isArray(d.players))STATE.players=d.players;if(Array.isArray(d.history))STATE.history=d.history;}
      else STATE.docRef.set({players:STATE.players,history:STATE.history});
      onCloudUpdate();
    },err=>{console.warn("Firebase:",err);STATE.cloud=false;setCloudBadge();});
  }catch(e){console.warn("Firebase init:",e);STATE.cloud=false;}
}
function onCloudUpdate(){
  setCloudBadge();
  const cur=[...document.querySelectorAll(".screen")].find(s=>s.style.display==="block");
  if(!cur)return;
  if(cur.id==="home")renderHome();
  if(cur.id==="screen-week")showWeek();
  if(cur.id==="screen-history")showHistory();
}
function download(fn,obj){const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(obj,null,1));a.download=fn;a.click();}

// ---- quy diem nhanh ----
function quickScores(tier,positions,spd,wr){
  const BASE={NS:8.5,K:7.0,TB:5.5,Y:4.0};
  const TILT={HV:[-0.5,0,-1.5,1.5,0.5,0.5],TV:[0.5,1.0,-0.5,0,0.5,1.0],"TĐ":[1.0,-0.5,1.5,-1.5,0.5,0]};
  const SPD={F:8.0,S:3.5,"":5.5}, WR={H:8.0,L:3.0,"":5.5}, TMt={NS:7.5,K:6.0,TB:5.0,Y:4.0};
  const rhu=x=>Math.max(1,Math.min(10,Math.floor(x+0.5)));
  const b=BASE[tier]; const outp=positions.filter(p=>TILT[p]);
  const avg=[0,1,2,3,4,5].map(i=> outp.length? outp.reduce((s,p)=>s+TILT[p][i],0)/outp.length : 0);
  return {KT:rhu(b+avg[0]),CH:rhu(b+avg[1]),DD:rhu(b+avg[2]),PN:rhu(b+avg[3]),
          TC:rhu(SPD[spd]+0.3*(b-5.5)),TL:rhu(b+avg[4]),DN:rhu(WR[wr]+0.2*(b-5.5)),TD:rhu(b+avg[5]),
          TM:positions.includes("GK")?rhu(TMt[tier]):0};
}

// ---- nav ----
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.style.display="none");
  $(id).style.display="block"; window.scrollTo(0,0);
  $("appTitle").innerHTML=TITLES[id]||TITLES.home;
  $("backBtn").style.display=id==="home"?"none":"flex";
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.s===id));
  if(id==="home") renderHome();
  if(id==="screen-create") buildRoster();
  if(id==="screen-players") buildEditor();
  if(id==="screen-week") showWeek();
  if(id==="screen-history") showHistory();
  setTimeout(fitMatch,0);
}
function renderHome(){
  const pl=getPlayers(), h=getHistory(), lp=pl.filter(p=>p.lp).length;
  $("homeStats").innerHTML=`
    <div class="stat accent"><div class="v">${pl.length}</div><div class="k">Cầu thủ</div></div>
    <div class="stat"><div class="v">${h.length}</div><div class="k">Đội đã lưu</div></div>
    <div class="stat"><div class="v">${h.length?h[0].label.split(" ")[0]:"—"}</div><div class="k">Đội tuần này</div></div>
    <div class="stat"><div class="v">${lp}</div><div class="k">Ưu tiên dự bị</div></div>`;
}

// ============ VE SO DO ============
function jersey(k){return `<svg class="jersey" viewBox="0 0 100 90" width="38" height="34"><path d="M30,8 L12,18 L4,40 L20,48 L26,40 L26,84 L74,84 L74,40 L80,48 L96,40 L88,18 L70,8 C70,8 64,20 50,20 C36,20 30,8 30,8 Z" fill="${k.body}" stroke="#00000055" stroke-width="2"/><path d="M30,8 L12,18 L4,40 L20,48 L26,38 L26,12 Z" fill="${k.sleeve}" stroke="#00000022" stroke-width="1"/><path d="M70,8 L88,18 L96,40 L80,48 L74,38 L74,12 Z" fill="${k.sleeve}" stroke="#00000022" stroke-width="1"/><path d="M34,9 Q50,21 66,9 L62,6 Q50,16 38,6 Z" fill="${k.trim}"/></svg>`;}
function chip(pl,label,kit,delay){const o=ov(pl);const star=o>=8?' <span class="star">★</span>':'';return `<div class="player pop" style="animation-delay:${delay.toFixed(2)}s">${jersey(kit)}<div class="name">${pl.n}${star}</div><div class="sub">${POSNAME[label]||label} · ${o.toFixed(1)}</div></div>`;}
function col(chips,gk){return `<div class="col${gk?' gkcol':''}">${chips.join("")}</div>`;}
const SLAB=["GK","Thòng","HV","HV","TVtt","TV","TĐ"];
function teamCols(ev,kit,sel,reverse){
  const bands=[[0],[1,2,3],[4,5,6]];
  let cols=bands.map((band,bi)=>col(band.map((c,j)=>chip(sel[ev.starters[c]],SLAB[c],kit,bi*0.30+j*0.07)),bi===0));
  if(reverse)cols=cols.reverse(); return cols.join("");
}
function subsItems(ev,sel){return ev.bench.slice().sort((a,b)=>ov(sel[b])-ov(sel[a])).map(i=>`<span class="subchip">${sel[i].n} <b>${ov(sel[i]).toFixed(1)}</b></span>`).join("");}
function card(m,o,ctxt,label,ev,sel){
  const fast=m.pace>o.pace, nm=c=>sel[ev.starters[c]].n;
  const stars=[0,1,2,3,4,5,6].filter(c=>ov(sel[ev.starters[c]])>=8).map(c=>sel[ev.starters[c]].n);
  const tb=ev.bench.slice().sort((a,b)=>ov(sel[b])-ov(sel[a]))[0], topbench=tb!==undefined?sel[tb].n:"—";
  const b=[];
  if(stars.length)b.push(`⭐ Đầu tàu <b>${stars.join(" + ")}</b> — gánh điểm và tạo đột biến ở mọi thời điểm.`);
  b.push(`🎯 Hàng công sắc, dứt điểm TB <b>${m.atk.toFixed(1)}/10</b>, mũi nhọn <b>${nm(6)}</b> chốt hạ trước khung thành.`);
  b.push(`🛡️ Tuyến dưới chắc, phòng ngự TB <b>${m.defPN.toFixed(1)}/10</b>: trung vệ <b>${nm(1)}</b> bọc lót, thủ môn <b>${nm(0)}</b> trấn giữ.`);
  b.push(fast?`⚡ Tốc độ vượt trội (<b>${m.pace.toFixed(1)}/10</b>) → phản công chớp nhoáng, pressing tầm cao ngạt thở.`:`🧠 Đồng đều & lì đòn (độ nhiệt <b>${m.heat.toFixed(1)}/10</b>) → cầm bóng, đập nhả, áp đặt thế trận.`);
  b.push(`🔁 Băng ghế còn <b>${topbench}</b> để bơm sức, giữ cường độ tới phút chót.`);
  const weak=fast?"khi mất bóng cần 3 mũi trên tích cực lùi về; gặp đối thủ biết cầm nhịp sẽ phải kiên nhẫn hơn":"tốc độ thấp hơn một nhịp — phải bọc lót kín, tránh để đối thủ thốc thẳng sau lưng";
  const plan=fast?"đẩy cao pressing, đoạt bóng nhanh rồi tung tốc độ kết liễu — ghi bàn sớm để dẫn dắt thế trận":"kiểm soát bóng, kéo giãn đối thủ rồi phối hợp trung lộ tung đòn quyết định";
  return `<div class="card"><h3 style="color:${ctxt}">${label}</h3><ul class="ul">${b.map(x=>`<li>${x}</li>`).join("")}</ul><div class="wk">⚠️ <b>Điểm cần lưu ý:</b> ${weak}.</div><div class="pl-win">🏆 <b>Cách thắng:</b> ${plan}.</div></div>`;
}
function render(res,sel,target){
  target=target||"result"; const box=$(target);
  if(!res||res.error){box.innerHTML="";return;}
  const A=res.evA,B=res.evB;
  const dtot=Math.abs(A.total-B.total), pct=100*dtot/((A.total+B.total)/2);
  const faster=A.pace>B.pace?"A":"B", slower=faster==="A"?"B":"A";
  const pred=`Trận 50-50 — chênh tổng chỉ ~${pct.toFixed(1)}%. Dự đoán <b>3-3</b> hoặc chênh 1 bàn; đội ${faster} nhanh hơn nhỉnh ở phản công, đội ${slower} kiểm soát tốt thì thắng sít sao.`;
  const intro=`Hai đội chênh tổng chỉ <b>~${pct.toFixed(1)}%</b> — gần như <b>50/50</b>. Khác biệt nằm ở <b>chất chơi</b> chứ không phải trình độ: một bên thiên <b>tốc độ – phản công</b>, một bên thiên <b>kiểm soát – chắc chắn</b>. Mỗi đội đều có ngôi sao, thủ môn ngang nhau, công–thủ tương đương — đội nào cũng có cửa thắng sòng phẳng. Ra sân cứ tự tin!`;
  const rows=[["Sức mạnh đội hình chính",A.startFit.toFixed(1),B.startFit.toFixed(1)],["Tổng cả đội (chính + dự bị)",A.total.toFixed(1),B.total.toFixed(1)],["Ngôi sao (điểm tổng ≥ 8)",A.stars,B.stars],["Thủ môn",A.gkFit.toFixed(1),B.gkFit.toFixed(1)],["Phòng ngự tuyến dưới",A.defPN.toFixed(1),B.defPN.toFixed(1)],["Dứt điểm tuyến trên",A.atk.toFixed(1),B.atk.toFixed(1)],["Tốc độ trung bình",A.pace.toFixed(1),B.pace.toFixed(1)],["Độ nhiệt (chịu chạy)",A.heat.toFixed(1),B.heat.toFixed(1)]];
  box.innerHTML=`
  <div class="pred">🔮 <b>Dự đoán:</b> ${pred}</div>
  <div class="matchwrap"><div class="match">
   <div class="mhead"><div class="mh l" style="background:${KIT_A.body};color:#fff">🔴 ĐỘI A · Quỷ Đỏ ▶</div><div class="mh r" style="background:${KIT_B.body};color:#11224f">◀ Pháo Thủ · ĐỘI B 🟡</div></div>
   <div class="field"><div class="mk vhalf"></div><div class="mk ccircle"></div><div class="mk boxL"></div><div class="mk boxR"></div><div class="mk goalL"></div><div class="mk goalR"></div>${teamCols(A,KIT_A,sel,false)}${teamCols(B,KIT_B,sel,true)}</div>
   <div class="benchrow"><div class="benchcol l"><span class="subs-lbl">Dự bị A:</span>${subsItems(A,sel)}</div><div class="benchcol"><span class="subs-lbl">Dự bị B:</span>${subsItems(B,sel)}</div></div>
  </div></div>
  <div class="report"><h2>⚖️ Ưu – nhược điểm</h2><div class="persuade">${intro}</div><div class="cards">${card(A,B,CAtxt,"Đội A · Quỷ Đỏ",A,sel)}${card(B,A,CBtxt,"Đội B · Pháo Thủ",B,sel)}</div>
  <h2>📊 Chỉ số đánh giá</h2><table class="stat"><tr><th>Chỉ số</th><th>Đội A</th><th>Đội B</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table></div>`;
  fitMatch();
}
function fitMatch(){
  document.querySelectorAll(".matchwrap").forEach(wrap=>{
    if(!wrap.clientWidth)return; const m=wrap.querySelector(".match"); if(!m)return;
    const scale=Math.min(1,wrap.clientWidth/832);
    m.style.transform=scale<1?`scale(${scale})`:"none"; wrap.style.height=scale<1?(m.offsetHeight*scale)+"px":"";
  });
}
window.addEventListener("resize",fitMatch);

// ============ TAO DOI ============
let curPlayers=[], cstate={key:"",results:[],idx:0,subset:null};
function buildRoster(){
  curPlayers=getPlayers(); cstate={key:"",results:[],idx:0,subset:null};
  const roster=$("roster"); roster.innerHTML="";
  curPlayers.forEach((p,i)=>{
    const el=document.createElement("label"); el.className="pl-item on";
    el.innerHTML=`<span class="avatar" style="background:${avColor(p.n)}">${initials(p.n)}</span><span class="pl-name"><span>${p.n}</span>${p.lp?'<span class="lp-dot" title="ưu tiên dự bị"></span>':''}</span><span class="ovb">${ov(p).toFixed(1)}</span><input type="checkbox" data-i="${i}" checked>`;
    el.querySelector("input").addEventListener("change",e=>{el.classList.toggle("off",!e.target.checked);el.classList.toggle("on",e.target.checked);updateCount();});
    roster.appendChild(el);
  });
  $("result").innerHTML=""; $("status").textContent=""; $("saveWeek").style.display="none"; updateCount();
}
function selectedIdx(){return [...$("roster").querySelectorAll("input:checked")].map(c=>+c.dataset.i);}
function updateCount(){const n=selectedIdx().length;$("count").innerHTML=`Đã chọn <b>${n}</b>`+(n<14?` <span style="color:#dc2626">(cần ≥14)</span>`:(n%2?` <span style="color:#d97706">(lẻ)</span>`:""));}
$("all").onclick=()=>{$("roster").querySelectorAll("input").forEach(c=>{c.checked=true;c.closest(".pl-item").classList.add("on");c.closest(".pl-item").classList.remove("off");});updateCount();};
$("none").onclick=()=>{$("roster").querySelectorAll("input").forEach(c=>{c.checked=false;c.closest(".pl-item").classList.remove("on");c.closest(".pl-item").classList.add("off");});updateCount();};
$("go").onclick=()=>{
  const sel=selectedIdx();
  if(sel.length<14){$("status").innerHTML='<span style="color:#dc2626">Cần chọn ít nhất 14 người (7 vs 7).</span>';$("result").innerHTML="";$("saveWeek").style.display="none";return;}
  $("status").textContent="⏳ Đang chia đội…"; $("go").disabled=true;
  setTimeout(()=>{
    const key=sel.join(","); let fresh=false;
    if(key!==cstate.key){const subset=sel.map(i=>curPlayers[i]);const res=TeamSolver.solve(subset);if(res.error){$("status").innerHTML='<span style="color:#dc2626">'+res.error+'</span>';$("go").disabled=false;return;}cstate={key,results:res,idx:0,subset};fresh=true;}
    else cstate.idx=(cstate.idx+1)%cstate.results.length;
    render(cstate.results[cstate.idx],cstate.subset,"result");
    $("status").innerHTML=fresh?`Cách chia cân nhất · bấm <b>Tạo 2 đội</b> lần nữa để đổi`:`Phương án cân thứ <b>${cstate.idx+1}/${cstate.results.length}</b> · bấm tiếp để đổi`;
    $("saveWeek").style.display="inline-block";
    $("go").disabled=false;
  },30);
};
$("saveWeek").onclick=()=>{
  if(!cstate.results.length)return;
  const now=new Date();
  const rec={id:now.getTime(),label:now.toLocaleDateString("vi-VN")+" "+now.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"}),
             n:cstate.subset.length, subset:cstate.subset, result:cstate.results[cstate.idx]};
  const h=getHistory(); h.unshift(rec); setHistory(h);
  $("saveWeek").textContent="✅ Đã lưu!"; setTimeout(()=>$("saveWeek").textContent="💾 Lưu làm đội tuần này",1500);
};

// ============ CAP NHAT CAU THU ============
function rowHtml(p){
  p=p||{n:"",KT:6,CH:6,DD:6,PN:6,TC:6,TL:6,DN:6,TD:6,TM:0,lp:false};
  const num=k=>`<td><input type="number" min="0" max="10" data-k="${k}" value="${p[k]}"></td>`;
  return `<tr>
    <td><input type="checkbox" class="lp" ${p.lp?"checked":""}></td>
    <td style="text-align:left"><input type="text" class="nm" value="${(p.n||"").replace(/"/g,'&quot;')}"></td>
    ${["KT","CH","DD","PN","TC","TL","DN","TD","TM"].map(num).join("")}
    <td><button class="iconbtn" title="Nhập nhanh" onclick="openQuick(this)">⚡</button></td>
    <td><button class="iconbtn" title="Xóa" onclick="this.closest('tr').remove()">🗑️</button></td>
  </tr>`;
}
function buildEditor(){$("editor-body").innerHTML=getPlayers().map(rowHtml).join("");}
function addPlayerRow(){$("editor-body").insertAdjacentHTML("beforeend",rowHtml());}
function collectEditor(){
  return [...$("editor-body").querySelectorAll("tr")].map(tr=>{
    const o={n:tr.querySelector(".nm").value.trim(),lp:tr.querySelector(".lp").checked};
    tr.querySelectorAll("input[type=number]").forEach(inp=>o[inp.dataset.k]=Math.max(0,Math.min(10,+inp.value||0)));
    return o;
  }).filter(o=>o.n);
}
function savePlayersFromEditor(){const a=collectEditor();setPlayers(a);alert("Đã lưu "+a.length+" cầu thủ.");}
function exportPlayers(){download("players.json",collectEditor());}
function resetPlayers(){if(confirm("Khôi phục danh sách mặc định? (mất chỉnh sửa)")){localStorage.removeItem(LS.players);buildEditor();}}
$("impFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;setPlayers(a);buildEditor();alert("Đã nhập "+a.length+" cầu thủ.");}catch(err){alert("File JSON không hợp lệ.");}};r.readAsText(f);e.target.value="";};
let quickRowBtn=null;
function openQuick(btn){quickRowBtn=btn.closest("tr");$("quickModal").classList.add("on");}
function closeQuick(){$("quickModal").classList.remove("on");quickRowBtn=null;}
function applyQuick(){
  if(!quickRowBtn)return;
  const tier=$("q-tier").value;
  const pos=[]; if($("q-GK").checked)pos.push("GK"); if($("q-HV").checked)pos.push("HV"); if($("q-TV").checked)pos.push("TV"); if($("q-TD").checked)pos.push("TĐ");
  const spd=document.querySelector('input[name=q-spd]:checked').value, wr=document.querySelector('input[name=q-wr]:checked').value;
  const s=quickScores(tier,pos,spd,wr);
  quickRowBtn.querySelectorAll("input[type=number]").forEach(inp=>inp.value=s[inp.dataset.k]);
  closeQuick();
}

// ============ DOI TUAN NAY ============
function showWeek(){
  const h=getHistory();
  if(!h.length){$("week-info").innerHTML="";$("week-result").innerHTML='<div class="empty"><span class="big">📋</span>Chưa có đội nào được lưu.<br>Vào <b>Tạo đội</b> → chia xong bấm <b>Lưu làm đội tuần này</b>.</div>';return;}
  $("week-info").innerHTML=`Lưu lúc <b>${h[0].label}</b> · ${h[0].n} người`;
  render(h[0].result,h[0].subset,"week-result"); setTimeout(fitMatch,0);
}

// ============ LICH SU ============
function showHistory(){
  const h=getHistory(); $("history-detail").innerHTML="";
  if(!h.length){$("history-list").innerHTML='<div class="empty"><span class="big">🕐</span>Chưa có lịch sử.</div>';return;}
  $("history-list").innerHTML=h.map(r=>`<div class="history-item"><span class="h-ic">⚽</span><div class="meta"><div class="dt">${r.label}</div><div class="sub2">${r.n} người</div></div><button class="btn alt sm" onclick="viewHistory(${r.id})">👁️ Xem</button><button class="iconbtn" onclick="delHistory(${r.id})" title="Xóa">🗑️</button></div>`).join("");
}
function viewHistory(id){const r=getHistory().find(x=>x.id===id);if(!r)return;render(r.result,r.subset,"history-detail");$("history-detail").scrollIntoView({behavior:"smooth"});setTimeout(fitMatch,0);}
function delHistory(id){if(!confirm("Xóa bản ghi này?"))return;setHistory(getHistory().filter(x=>x.id!==id));showHistory();}
function exportHistory(){download("history.json",getHistory());}

localLoad(); initCloud(); setCloudBadge(); show("home");
</script>
